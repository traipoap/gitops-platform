    - name: Download and Install Istio CLI to System Path
      shell: |
        curl -L https://istio.io/downloadIstio | ISTIO_VERSION=1.30.2 TARGET_ARCH=x86_64 TARGET_OS=Linux sh -
        cp istio-1.30.2/bin/istioctl /usr/local/bin/istioctl
        rm -rf istio-1.30.2
      args:
        creates: /usr/local/bin/istioctl

    - name: Install Istio with Ambient Profile (Fixed CNI Bin Path)
      shell: |
        istioctl install --set profile=ambient \
          --set values.cni.cniConfDir=/var/lib/rancher/k3s/agent/etc/cni/net.d \
          --set values.cni.cniBinDir=/var/lib/rancher/k3s/data/cni \
          --set values.cni.privileged=true \
          --skip-confirmation
      register: istio_install
      changed_when: "'Installation complete' in istio_install.stdout"
      environment:
        KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

    - name: Install Kubernetes Gateway API (CRD)
      shell: |
        kubectl get crd gateways.gateway.networking.k8s.io &> /dev/null || \
        kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/experimental-install.yaml
      register: gateway_api_install
      changed_when: "'created' in gateway_api_install.stdout or 'configured' in gateway_api_install.stdout"
