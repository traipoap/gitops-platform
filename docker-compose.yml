services:
  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
    ports:
      - "4321:4321"
    environment:
      - VITE_API_URL=http://backend:8080
      - NODE_ENV=production
    runtime: youki

  backend:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - QUICKWIT_URL=${QUICKWIT_URL:-http://quickwit:8000}
      - PORT=8080
    runtime: youki
