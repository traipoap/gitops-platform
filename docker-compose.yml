services:
  frontend:
    image: ghcr.io/traipoap/app-frontend:latest
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=production
    runtime: youki
    networks:
      - app-network

  backend:
    image: ghcr.io/traipoap/app-backend:latest
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - QUICKWIT_URL=${QUICKWIT_URL:-http://quickwit-searcher.example.com}
      - PORT=8080
    runtime: youki
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
