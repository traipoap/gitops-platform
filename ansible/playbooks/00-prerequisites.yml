- name: Disable IPv6
  hosts: all
  become: true
  tasks:
    - name: Disable IPv6
      sysctl:
        # Same like sudo -S sysctl -w net.ipv6.conf.all.disable_ipv6=1 > /dev/null
        name: net.ipv6.conf.all.disable_ipv6
        value: 1
        state: present
    - name: Disable IPv6 by default
      sysctl:
        # Same like sudo -S sysctl -w net.ipv6.conf.default.disable_ipv6=1 > /dev/null
        name: net.ipv6.conf.default.disable_ipv6
        value: 1
        state: present
    - name: Disable IPv6 on loopback
      sysctl:
        name: net.ipv6.conf.lo.disable_ipv6
        value: 1
        state: present

    # ---------------------------------------------------------------------------
    # Save into GRUB: disable IPv6 at kernel boot with the ipv6.disable=1 boot
    # parameter. More thorough than sysctl (the IPv6 module is not loaded at
    # all). Takes effect after reboot. Idempotent — safe to re-run.
    # ---------------------------------------------------------------------------
    - name: Repair line corrupted by a previous broken lineinfile run
      # A previous version of this playbook wrote the literal text
      # "<backslash>1<backslash>2 ipv6.disable=1<backslash>3" into the file (lineinfile
      # needs backrefs: true to expand backreferences). Restore the standard
      # Ubuntu default line instead. No-op if the corrupted line is absent.
      lineinfile:
        path: /etc/default/grub
        regexp: '^\s*\\1\\2 ipv6\.disable=1\\3\s*$'
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet"'

    - name: Ensure ipv6.disable=1 is set for kernel boot
      # Marker-based block: idempotent, and safe no matter how the existing
      # GRUB_CMDLINE_LINUX lines are quoted. The ${VAR:-} shell expansion
      # appends to any existing kernel command line.
      blockinfile:
        path: /etc/default/grub
        marker: "# {mark} ANSIBLE MANAGED: disable IPv6 at kernel boot"
        block: |
          # Appends to any existing kernel command line (shell expansion).
          GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:-} ipv6.disable=1"

    - name: Verify /etc/default/grub can be sourced (same as grub-mkconfig)
      command: sh -c '. /etc/default/grub'
      register: grub_source_check
      failed_when: false
      changed_when: false

    - name: Abort with diagnostics if /etc/default/grub is invalid
      fail:
        msg: >-
          /etc/default/grub failed to source:
          {{ grub_source_check.stderr | default('no error text') }}
          Run on the affected VM: cat -n /etc/default/grub
          Find and remove the broken line, then re-run this playbook.
      when: grub_source_check.rc != 0

    - name: Regenerate GRUB configuration (Debian/Ubuntu)
      command: update-grub
      when:
        - grub_source_check.rc == 0
        - ansible_facts['os_family'] == 'Debian'

    - name: Regenerate GRUB configuration (RHEL/CentOS, BIOS)
      # For EFI boot, point -o at /boot/efi/EFI/<distro>/grub.cfg instead
      command: grub2-mkconfig -o /boot/grub2/grub.cfg
      when:
        - grub_source_check.rc == 0
        - ansible_facts['os_family'] == 'RedHat'
