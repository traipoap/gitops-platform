---
- name: Install youki (Prebuilt binary)
  shell:
    cmd: "curl -sSfL https://github.com/youki-dev/youki/releases/download/v0.7.0/youki-0.7.0-$(uname -m)-musl.tar.gz | tar -xzvC /usr/bin/ youki"
  register: youki_install
  ignore_errors: true

- name: Add runtime class
  copy:
    content: |
      # RuntimeClass is defined in the node.k8s.io API group
      apiVersion: node.k8s.io/v1
      kind: RuntimeClass
      metadata:
        # The name the RuntimeClass will be referenced by.
        # RuntimeClass is a non-namespaced resource.
        name: youki
      # The name of the corresponding CRI configuration
      handler: youki

    dest: /var/lib/rancher/k3s/server/manifests/youki-runtime-class.yaml
  register: runtime_class
  ignore_errors: true

- name: Add youki config
  copy:
    content: |
      {{ template "base" . }}

      [plugins.'io.containerd.cri.v1.runtime'.containerd]
        default_runtime_name = "youki"

      [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.youki]
        runtime_type = "io.containerd.runc.v2"
        [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.youki.options]
          BinaryName = "/usr/bin/youki"
          SystemdCgroup = true

    dest: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.tmpl
  register: youki_config
  ignore_errors: true
