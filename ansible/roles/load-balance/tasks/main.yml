# SPDX-License-Identifier: Apache-2.0

  # 1. Update and Install Core Packages
  - name: Install fundamental packages (HAProxy, NFS)
    apt:
      update_cache: yes
      name:
        - haproxy
      state: present

  # 2. Configure HAProxy
  - name: Deploy HAProxy configuration
    template:
      src: "haproxy.cfg.j2"
      dest: "/etc/haproxy/haproxy.cfg"
    notify: Restart HAProxy
