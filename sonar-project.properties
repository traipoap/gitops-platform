# SonarQube scanner configuration (committed on purpose — nothing secret in here)
#
#   sonar.projectKey  MUST match a project that already exists on your SonarQube
#                     server (Admin → Projects → the project's key).
#                     If it does not exist, SonarQube fails with
#                     "Project <key> not found".
#
# The server address and auth token are NOT here on purpose — they come from
# GitHub Actions repo Variables/Secrets (SONAR_HOST_URL, SONAR_TOKEN).

sonar.projectKey=traipoap_gitops-platform_af29360e-471f-4f98-8ec8-f01390dfd3f6
sonar.projectName=gitops-platform
sonar.projectVersion=0.0.1

# What to analyze
sonar.sources=backend,frontend/src,ansible,terraform
sonar.exclusions=**/*.min.js,**/*.test.js,frontend/package-lock.json
sonar.tests=
