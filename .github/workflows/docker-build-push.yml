name: Docker Build and Push to GHCR & Update Fleet Infra

on:
  push:
    branches: [main]
    paths:
      - 'docker/frontend/**'
      - 'docker/backend/**'
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # สำคัญสำหรับการ Push Image เข้า GHCR
    strategy:
      matrix:
        include:
          - service: frontend
            dockerfile: ./docker/frontend/Dockerfile
            image: ghcr.io/traipoap/frontend
          - service: backend
            dockerfile: ./docker/backend/Dockerfile
            image: ghcr.io/traipoap/backend

    outputs:
      # ส่งผ่าน run_number ไป job ถัดไป (เพื่อให้แน่ใจว่าเลขตรงกัน)
      version: 0.0.${{ github.run_number }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # ต้องมั่นใจว่า Token นี้มีสิทธิ์ write:packages สำหรับ org นี้
          password: ${{ secrets.TOKEN_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Push เฉพาะตอน Push เข้า main (ไม่ Push ตอน Pull Request)
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ matrix.image }}:${{ steps.build-and-push.outputs.version || format('0.0.{0}', github.run_number) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────
  update-manifest:
    needs: build-and-push
    if: github.event_name == 'push' # ทำงานเฉพาะตอน Push เข้า main จริงๆ
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fleet Infra Repo (Target Repo)
        uses: actions/checkout@v6
        with:
          repository: traipoap/fleet-infra # 👈 จุดนี้สำคัญที่สุด: บอกให้ไป clone repo ปลายทาง
          token: ${{ secrets.TOKEN_REGISTRY }} # Token ต้องมีสิทธิ์ Write ใน fleet-infra ด้วย
          ref: main

      - name: Update Image Tags with yq
        uses: mikefarah/yq@master
        with:
          cmd: |
            # แก้ไขไฟล์ใน repo ที่เพิ่ง Clone มา (fleet-infra)
            yq -i '.spec.template.spec.containers[0].image = "ghcr.io/traipoap/frontend:0.0.${{ github.run_number }}" ./applications/base/frontend-deployment.yaml
            yq -i '.spec.template.spec.containers[0].image = "ghcr.io/traipoap/backend:0.0.${{ github.run_number }}" ./applications/base/backend-deployment.yaml

      - name: Commit and Push to Fleet Infra
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          # ใช้ [skip ci] เพื่อไม่ให้ fleet-infra Repo มีการ Trigger Workflow ซ้ำซ้อน (Loop)
          git commit -m "chore: sync image tags to ${{ needs.build-and-push.outputs.version }} [skip ci]" || exit 0

          git push origin main
