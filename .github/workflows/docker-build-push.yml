name: Docker Build and Push

on:
  push:
    branches: [main]
    paths:
      - 'docker/frontend/**'
      - 'docker/backend/**'
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: frontend
            dockerfile: ./docker/frontend/Dockerfile
            image: ghcr.io/traipoap/app-frontend
          - service: backend
            dockerfile: ./docker/backend/Dockerfile
            image: ghcr.io/traipoap/app-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Version Tag
        # dev-vYYMMDD-RunID
        id: version
        run: |
          echo "TAG=dev-$(date +%Y%m%d)-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:${{ steps.version.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output Image Tag
        if: github.event_name == 'push'
        run: |
          echo "Image pushed with tag: ${{ steps.version.outputs.TAG }}"
          echo "FluxCD will detect this tag shortly if configured correctly."
