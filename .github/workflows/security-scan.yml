# SPDX-License-Identifier: Apache-2.0

# Security gate for the whole repository, run on every push / PR:
#   1. Gitleaks  — scans full git history for hardcoded secrets
#   2. SonarQube — code quality + security hotspots
#
# Configuration lives in Settings → Secrets and variables → Actions (NOT in this file):
#   Variable : SONAR_HOST_URL  e.g. http://10.10.16.4:9000
#   Secret   : SONAR_TOKEN     e.g. sonarqube_xxxxxxxxxxxxxxxx

name: Security Scan (Gitleaks + SonarQube)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks — secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload the SARIF report
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # scan ALL commits, not just the tip

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Lets the action publish the SARIF report to the Security tab
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: SonarQube — code quality & security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post inline findings on PRs
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for accurate new-code analysis

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          # Server address (repo Variable) + auth token (repo Secret)
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
