name: Docker Build, Scan and Push to GHCR

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      dockerfile:
        required: true
        type: string

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        run: docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.TOKEN_REGISTRY }}

      - name: Build image
        run: docker build -t ghcr.io/traipoap/${{ inputs.service }}:0.0.${{ github.run_number }} --build-arg VERSION=0.0.${{ github.run_number }} -f ${{ inputs.dockerfile }} .

      # Scan the LOCAL image BEFORE pushing — if the gate fails, the Push
      # step is skipped and no vulnerable image reaches the registry.
      # (trivy-action v0.36+ input schema: scan-type + scan-ref for local
      # images; `image`/`output-format`/`output-file` were removed)
      - name: Run Trivy vulnerability scanner (local image mode)
        uses: aquasecurity/trivy-action@v0.74.0
        with:
          scan-type: 'image'
          scan-ref: ghcr.io/traipoap/${{ inputs.service }}:0.0.${{ github.run_number }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'os,library'
          timeout: '10m'
          # Fail on known (fixable) CRITICAL/HIGH findings → blocks the push.
          # Set exit-code: '0' to make this report-only.
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security tab
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ inputs.service }}

      - name: Push image
        if: success()
        run: docker push ghcr.io/traipoap/${{ inputs.service }}:0.0.${{ github.run_number }}
