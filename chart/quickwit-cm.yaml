config:
  version: 0.8
  # Override the cluster ID generated by the chart here.
  # cluster_id: my-cluster
  listen_address: 0.0.0.0
  gossip_listen_port: 7282
  data_dir: /quickwit/qwdata
  default_index_root_uri: s3://default-bucket/indexes
  metastore_uri: "s3://default-bucket/metastore"
  storage:
    s3:
      endpoint: "http://192.168.1.4:3900"
      region: garage
      # We recommend using IAM roles and permissions to access Amazon S3 resources,
      # but you can specify a pair of access and secret keys if necessary.
      access_key_id: REDACTED_GARAGE_ACCESS_KEY
      secret_access_key: REDACTED_GARAGE_SECRET_KEY
      force_path_style_access: true
