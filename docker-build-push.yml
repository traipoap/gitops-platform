name: Docker Build and Push to GHCR & Update Fleet Infra

on:
  push:
    branches: [main]
    paths:
      - 'docker/frontend/**'
      - 'docker/backend/**'
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: frontend
            dockerfile: ./docker/frontend/Dockerfile
            image: ghcr.io/traipoap/frontend
          - service: backend
            dockerfile: ./docker/backend/Dockerfile
            image: ghcr.io/traipoap/backend

    outputs:
      version: 0.0.${{ github.run_number }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ matrix.image }}:${{ steps.build-and-push.outputs.version || format('0.0.{0}', github.run_number) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────
  update-manifest:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fleet Infra Repo (Target Repo)
        uses: actions/checkout@v6
        with:
          repository: traipoap/fleet-infra # 👈 GitOps Bootstrap Repo
          token: ${{ secrets.TOKEN_REGISTRY }} # 👈 This Token has write access to GHCR
          ref: main

      - name: Update Image Tags with yq
        uses: mikefarah/yq@master
        env:
          NEW_TAG: "0.0.${{ github.run_number }}"
        with:
          cmd: |
            yq -i '.spec.template.spec.containers[0].image = "ghcr.io/traipoap/frontend:${{ needs.build-and-push.outputs.version }}"' ./applications/base/frontend-deployment.yaml
            yq -i '.spec.template.spec.containers[0].image = "ghcr.io/traipoap/backend:${{ needs.build-and-push.outputs.version }}"' ./applications/base/backend-deployment.yaml

      - name: Commit and Push to Fleet Infra
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: sync image tags to ${{ needs.build-and-push.outputs.version }} [skip ci]" || exit 0
          git push origin main
