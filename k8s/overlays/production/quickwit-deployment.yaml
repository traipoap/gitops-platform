apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickwit
  namespace: log-management
  labels:
    app: quickwit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quickwit
  template:
    metadata:
      labels:
        app: quickwit
    spec:
      containers:
        - name: quickwit
          image: quickwit/quickwit:v0.9.1
          args:
            - run
            - --collector-output-dir=/dev/shm/collector
            - --http-addr=0.0.0.0:8000
          ports:
            - name: grpc
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /dev/shm/collector
            - name: indexes
              mountPath: /indexes
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /_ping
              port: grpc
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_ping
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: indexes
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
