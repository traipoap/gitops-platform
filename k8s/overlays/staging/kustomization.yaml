apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: staging-

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |
      - op: replace
        /spec/replicas: 2
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        /spec/replicas: 2

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - NODE_ENV=staging
      - QUICKWIT_URL=http://quickwit:8000
      - VITE_API_URL=http://backend:8080
      - LOG_LEVEL=info

images:
  - name: traipoap/log-management-backend
    newName: traipoap/log-management-backend
    newTag: staging-0.1.0

  - name: traipoap/log-management-frontend
    newName: traipoap/log-management-frontend
    newTag: staging-0.1.0
