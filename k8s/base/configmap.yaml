apiVersion: v1
kind: ConfigMap
metadata:
  name: lumina-config
  namespace: lumina
data:
  # Frontend configuration
  FRONTEND_PORT: "4321"
  NODE_ENV: "development"
  BACKEND_HOST: "http://backend-svc.lumina.svc.cluster.local"
  BACKEND_INDEX_PREFIX: "logs"
  BACKEND_SEARCH_BACKEND: "http://backend-svc.lumina.svc.cluster.local:8080"

  # Backend configuration
  QUICKWIT_URL: "http://quickwit-searcher.lumina.svc.cluster.local:7280"
  BACKEND_PORT: "8080"

  # Elasticsearch connection (if used)
  ELASTICSEARCH_HOST: "elasticsearch"
  ELASTICSEARCH_PORT: "9200"

  # JWT settings
  JWT_SECRET: "your-secret-key-here-change-in-production"
  JWT_EXPIRES_IN: "24h"

  # Resource limits
  MEMORY_LIMIT: "512Mi"
  CPU_LIMIT: "500m"
